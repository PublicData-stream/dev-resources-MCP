[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = false

[advisories]
unmaintained = "all"
unsound = "all"

[licenses]
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MIT-0", "Unicode-3.0", "Zlib"]
# Exact first-party scope; do not admit arbitrary copyleft dependencies globally.
# Owner: repository maintainers. Review by 2027-01-24 or on graph/version changes.
exceptions = [
 { crate = "devres-domain@0.0.0", allow = ["AGPL-3.0-only"] },
 { crate = "devres-application@0.0.0", allow = ["AGPL-3.0-only"] },
 { crate = "devres-adapters@0.0.0", allow = ["AGPL-3.0-only"] },
 { crate = "devres-server@0.0.0", allow = ["AGPL-3.0-only"] },
 # ZIP BZIP2 support: reviewed permissive redistribution/attribution terms.
 # Owner: repository maintainers. Review by 2027-01-24 or on graph changes.
 { crate = "libbz2-rs-sys@0.2.5", allow = ["bzip2-1.0.6"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
