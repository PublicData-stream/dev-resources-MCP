[package]
autotests = false
autoexamples = false
name = "devres-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
[lints]
workspace = true
[dependencies]
devres-domain = { version = "0.0.0", path = "../domain" }
devres-application = { version = "0.0.0", path = "../application" }
async-trait = "0.1"
ring = "=0.17.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "query"] }
futures = "0.3"
tracing = "0.1"
wreq = { version = "=0.16.3", default-features = false, features = ["tokio-rt", "stream", "prefix-symbols"] }
wreq-util = { version = "=0.2.1", default-features = false, features = ["emulation"] }
sha2 = "0.11"
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
sha1 = "0.11"
hex = "0.4"
fs2 = "0.4"
redb = { version = "=4.4.0", default-features = false, features = ["std"] }
tempfile = "3"
httpdate = "1"
tokio = { version = "1", features = ["process", "fs", "time", "sync", "io-util", "net", "signal", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
sqlx-core = { version = "=0.9.0", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-native-roots", "json", "migrate"] }
sqlx-postgres = { version = "=0.9.0", default-features = false, features = ["json"] }
quick-xml = { version = "0.42", features = ["serialize"] }
base64 = "0.22"
html5ever = "0.40"
tantivy = { version = "=0.27.0", default-features = false, features = ["mmap", "stemmer", "stopwords", "lz4-compression"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tar = "0.4"
flate2 = "1"
rustsec = { version = "=0.33.0", default-features = false }
semver = "1"
toml = "0.9"
url = "2"
axum = "0.8"
bytes = "1"
nix = { version = "0.30", default-features = false, features = ["signal", "process", "resource", "fs"] }
lopdf = { version = "=0.46.0", default-features = false }
zip = { version = "=9.0.0", default-features = false, features = ["deflate", "bzip2"] }
csv-core = "0.1"
pulldown-cmark = { version = "0.13.6", default-features = false }
regex = "=1.13.1"
yaml-rust2 = { version = "0.13", default-features = false }
aws-sdk-s3 = { version = "=1.157.0", default-features = false, features = ["rt-tokio", "http-1x"] }
aws-sdk-sts = { version = "=1.124.0", default-features = false, features = ["rt-tokio"] }
aws-credential-types = { version = "1", default-features = false }
aws-smithy-runtime-api = { version = "1", default-features = false, features = ["client", "http-1x"] }
aws-smithy-types = { version = "1", features = ["http-body-1-x", "rt-tokio"] }
http-body = "1"
http-body-util = "0.1"
http = "1"
percent-encoding = "2"
[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "net"] }

