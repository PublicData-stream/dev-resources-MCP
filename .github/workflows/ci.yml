name: Rust, dependencies, and containers
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Validated version tag; empty for ordinary CI
        type: string
        default: ''
  schedule:
    - cron: '41 3 * * 1'
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.release-tag || '' }}
  TMPDIR: /tmp
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_TARGET_DIR: /buildcache/rust/target
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: rust (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare release sources
        if: env.RELEASE_TAG != ''
        run: |
          scripts/verify-release-tag.sh "$RELEASE_TAG" "$GITHUB_SHA"
          python3 scripts/release_contract.py stamp --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - name: Isolate pinned toolchain
        run: |
          echo "RUSTUP_HOME=/tmp/devres-rustup" >> "$GITHUB_ENV"
          sudo install -d -o "$(id -u)" -g "$(id -g)" /buildcache/rust/target
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Verify native architecture
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: scripts/check-native-platform.sh "$PLATFORM"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 -m unittest discover -s scripts/tests
      - run: git diff --check
      - name: PostgreSQL persistence
        run: scripts/test-postgres.sh
      - name: Build and smoke native runtime image
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: scripts/test-image.sh --platform "$PLATFORM"
      - name: Install OCI artifact tools
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Exercise anonymous registry acceptance with local fixtures
        run: python3 scripts/test-release-registry.py
      - name: Build and smoke separate native images
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          version=0.0.0
          if [[ -n $RELEASE_TAG ]]; then
            version=$(python3 scripts/release_contract.py verify-stamped --tag "$RELEASE_TAG" --commit "$GITHUB_SHA")
          fi
          for target in server probe audit-worker; do
            scripts/test-image.sh --platform "$PLATFORM" --target "$target" \
              --revision "$GITHUB_SHA" --version "$version" \
              --oci-output "/tmp/devres-ci-oci-images/$target"
            if [[ -n $RELEASE_TAG ]]; then
              python3 scripts/release_images.py verify --directory "/tmp/devres-ci-oci-images/$target" \
                --target "$target" --arch "${PLATFORM#linux/}" --tag "$RELEASE_TAG" \
                --commit "$GITHUB_SHA" --output "/tmp/devres-ci-verified-$target.json"
            fi
          done
      - name: Retain tested release images
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-images-${{ matrix.arch }}
          path: /tmp/devres-ci-oci-images/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  dependencies:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare release sources
        if: env.RELEASE_TAG != ''
        run: |
          scripts/verify-release-tag.sh "$RELEASE_TAG" "$GITHUB_SHA"
          python3 scripts/release_contract.py stamp --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - name: Isolate pinned toolchain
        run: |
          echo "RUSTUP_HOME=/tmp/devres-rustup" >> "$GITHUB_ENV"
          sudo install -d -o "$(id -u)" -g "$(id -g)" /buildcache/rust/target
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit
      - run: cargo deny check
  e2e-build:
    name: e2e-build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Build native harness artifact
        run: scripts/ci-e2e.sh build "linux/${{ matrix.arch }}" "/tmp/devres-e2e-harness"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-harness-${{ matrix.arch }}
          path: /tmp/devres-e2e-harness/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  e2e:
    name: e2e (${{ matrix.scenario }}, ${{ matrix.arch }})
    needs: e2e-build
    strategy:
      fail-fast: false
      matrix:
        scenario: [docker, minikube]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
        arch: [amd64, arm64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-harness-${{ matrix.arch }}
          path: /tmp/devres-e2e-harness/
      - name: Verify and exercise native harness
        env:
          DEVRES_E2E_DIAGNOSTICS_DIR: /tmp/devres-e2e-diagnostics
        run: scripts/ci-e2e.sh test "${{ matrix.scenario }}" "linux/${{ matrix.arch }}" "/tmp/devres-e2e-harness"
      - name: Retain scenario diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics-${{ matrix.scenario }}-${{ matrix.arch }}
          path: /tmp/devres-e2e-diagnostics/
          if-no-files-found: warn
          retention-days: 7
  edge:
    if: always()
    needs: [e2e-build, e2e]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every native build and scenario
        env:
          BUILD_RESULT: ${{ needs.e2e-build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$BUILD_RESULT" = success && test "$E2E_RESULT" = success
